  <!-- TIME MACHINE -->
  <section class="view" data-view="time">
    <div class="card tm-ctl">
      <div class="row" style="justify-content:space-between">
        <h2 style="margin:0">Time Machine</h2>
        <div class="seg" id="tmMode"><button data-m="intra" class="on">Intraday</button><button data-m="swing">Swing</button></div>
      </div>
      <p class="small muted tm-lead" id="tmLead"></p>
      <div id="tmCtl"><div class="small muted">Loading…</div></div>
    </div>
    <div id="tmScanOut" aria-live="polite"></div>
    <div id="tmOut" aria-live="polite"></div>
    <div id="tmLearn"></div>
    <p class="small muted tm-fine">Models and counts, not forecasts. Nothing here places an order. Education and tooling, not financial advice.</p>
  </section>
